<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications - Nexyra Desktop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: { appBg: '#0B0F19', panelBg: '#111827', brand: '#06b6d4' }
      }
    }
  }
</script>

<style>
  body {
    background-color: #0B0F19;
    color: #e2e8f0;
    overflow: hidden; 
  }
  
  .glass-panel {
    background: rgba(17, 24, 39, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

  .no-select { user-select: none; }
  
  /* Animations */
  @keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  
  @keyframes popIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-enter { animation: popIn 0.2s ease-out forwards; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page-fade-in { animation: fadeIn 0.4s ease-out forwards; }

  /* App Card Removal Animation */
  .card-removing {
    transform: scale(0.9);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .sidebar-transition { transition: width 0.3s ease-in-out; }
</style>
</head>
<body class="h-screen w-full flex font-sans no-select relative">

  <!-- TOAST NOTIFICATION -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-3 pointer-events-none"></div>

  <!-- CONFIRMATION MODAL -->
  <div id="confirmModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
    <div class="glass-panel p-6 rounded-2xl w-[90%] max-w-md scale-95 transition-transform duration-300" id="modalContent">
      <div class="flex items-center gap-3 mb-4 text-red-400">
        <i class="ph-fill ph-trash text-3xl"></i>
        <h3 class="text-xl font-semibold text-white" id="modalTitle">Uninstall Application</h3>
      </div>
      <p class="text-gray-400 text-sm mb-6" id="modalDesc">Are you sure you want to completely remove this application and all its data?</p>
      <div class="flex justify-end gap-3">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Cancel</button>
        <button id="modalConfirmBtn" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-red-500/20">Uninstall</button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar" class="sidebar-transition w-64 md:w-64 w-20 bg-panelBg/80 border-r border-white/5 flex flex-col justify-between flex-shrink-0 z-40 max-md:absolute max-md:h-full transform max-md:-translate-x-full md:translate-x-0 transition-transform">
    <div>
      <div class="p-4 flex items-center justify-between h-16">
        <div class="flex items-center gap-2 overflow-hidden whitespace-nowrap">
          <i class="ph-fill ph-hexagon text-3xl text-cyan-400 shrink-0 drop-shadow-[0_0_8px_rgba(6,182,212,0.5)]"></i>
          <h1 class="text-xl font-bold tracking-wide text-white sidebar-text">NEXYRA</h1>
        </div>
        <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white hidden md:block shrink-0">
          <i class="ph ph-caret-line-left text-xl transition-transform" id="sidebarToggleIcon"></i>
        </button>
      </div>

      <nav class="p-3 flex flex-col gap-1 mt-2">
        <button onclick="window.location.href='home.html'" class="nav-btn flex items-center gap-3 w-full p-2.5 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg text-sm font-medium transition-all group relative">
          <i class="ph ph-squares-four text-xl shrink-0"></i> 
          <span class="sidebar-text whitespace-nowrap">Dashboard</span>
          <div class="absolute left-14 bg-black/90 px-2 py-1 text-xs rounded border border-white/10 opacity-0 hidden group-hover:block tooltip z-50">Dashboard</div>
        </button>
        <button onclick="window.location.href='processes.html'" class="nav-btn flex items-center gap-3 w-full p-2.5 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg text-sm font-medium transition-all group relative">
          <i class="ph ph-cpu text-xl shrink-0"></i> 
          <span class="sidebar-text whitespace-nowrap">Processes</span>
          <div class="absolute left-14 bg-black/90 px-2 py-1 text-xs rounded border border-white/10 opacity-0 hidden group-hover:block tooltip z-50">Processes</div>
        </button>
        <!-- ACTIVE STATE FOR APPLICATIONS -->
        <button onclick="window.location.href='applications.html'" class="nav-btn active flex items-center gap-3 w-full p-2.5 bg-cyan-500/10 text-cyan-400 rounded-lg text-sm font-medium transition-all group relative border-l-2 border-cyan-400">
          <i class="ph-fill ph-app-window text-xl shrink-0 drop-shadow-[0_0_5px_rgba(6,182,212,0.5)]"></i> 
          <span class="sidebar-text whitespace-nowrap">Applications</span>
          <div class="absolute left-14 bg-black/90 px-2 py-1 text-xs rounded border border-white/10 opacity-0 hidden group-hover:block tooltip z-50">Applications</div>
        </button>
        <button onclick="window.location.href='organizer.html'" class="nav-btn flex items-center gap-3 w-full p-2.5 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg text-sm font-medium transition-all group relative">
          <i class="ph ph-folder-notch text-xl shrink-0"></i> 
          <span class="sidebar-text whitespace-nowrap">Organizer</span>
          <div class="absolute left-14 bg-black/90 px-2 py-1 text-xs rounded border border-white/10 opacity-0 hidden group-hover:block tooltip z-50">Organizer</div>
        </button>
      </nav>
    </div>
    <div class="p-4 border-t border-white/5">
      <button class="flex items-center gap-3 w-full p-2 text-gray-400 hover:text-white transition-all text-sm group relative">
        <i class="ph ph-gear text-xl shrink-0"></i> 
        <span class="sidebar-text whitespace-nowrap">Settings</span>
        <div class="absolute left-14 bg-black/90 px-2 py-1 text-xs rounded border border-white/10 opacity-0 hidden group-hover:block tooltip z-50">Settings</div>
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-[#0B0F19] to-[#0B0F19]">
    
    <!-- Mobile Header -->
    <div class="md:hidden flex items-center justify-between p-4 border-b border-white/5 bg-panelBg/50 backdrop-blur-md">
      <div class="flex items-center gap-2">
        <i class="ph-fill ph-hexagon text-2xl text-cyan-400"></i>
        <h1 class="text-lg font-bold text-white">NEXYRA</h1>
      </div>
      <button onclick="toggleMobileSidebar()" class="text-gray-300 hover:text-white text-2xl"><i class="ph ph-list"></i></button>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 p-4 md:p-6 overflow-y-auto flex flex-col gap-6 page-fade-in">
      
      <!-- HEADER -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
        <div>
          <h2 class="text-2xl sm:text-3xl font-semibold text-white">Application Manager</h2>
          <p class="text-sm text-gray-400 mt-1">Install, update, and remove software</p>
        </div>
        <div class="flex gap-3 w-full sm:w-auto">
          <button onclick="triggerToast('Opening Nexyra App Store...', 'info')" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-cyan-500 hover:bg-cyan-600 text-black px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-[0_0_15px_rgba(6,182,212,0.3)]">
            <i class="ph-bold ph-download-simple"></i> Install App
          </button>
        </div>
      </div>

      <!-- FILTER BAR -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-1 border-b border-white/10 pb-4 gap-4">
        <div class="flex gap-2 bg-black/30 p-1 rounded-lg border border-white/5 w-full sm:w-auto overflow-x-auto">
          <button class="bg-white/10 text-white px-4 py-1.5 rounded-md text-sm font-medium transition-colors whitespace-nowrap">Installed (12)</button>
          <button class="text-gray-400 hover:text-white hover:bg-white/5 px-4 py-1.5 rounded-md text-sm font-medium transition-colors whitespace-nowrap flex items-center gap-1">
            Updates <span class="bg-cyan-500 text-black text-[10px] px-1.5 py-0.5 rounded-full ml-1 font-bold">2</span>
          </button>
          <button class="text-gray-400 hover:text-white hover:bg-white/5 px-4 py-1.5 rounded-md text-sm font-medium transition-colors whitespace-nowrap">System</button>
        </div>
        <div class="relative w-full sm:w-64">
          <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-500"></i>
          <input type="text" placeholder="Search applications..." class="w-full bg-black/40 border border-white/10 pl-9 pr-3 py-2 rounded-lg text-sm focus:outline-none focus:border-cyan-500 text-white placeholder-gray-500 transition-colors">
        </div>
      </div>

      <!-- APPS GRID CONTAINER -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="appGrid">
        <!-- Skeleton Loading Items -->
        <div class="glass-panel rounded-2xl p-5 flex flex-col h-48 animate-pulse">
          <div class="flex justify-between items-start mb-4">
            <div class="w-12 h-12 rounded-xl bg-white/5"></div>
            <div class="w-6 h-6 rounded bg-white/5"></div>
          </div>
          <div class="w-3/4 h-5 rounded bg-white/5 mb-2"></div>
          <div class="w-1/2 h-3 rounded bg-white/5 mb-4"></div>
          <div class="w-full h-8 rounded bg-white/5 mt-auto"></div>
        </div>
        <div class="glass-panel rounded-2xl p-5 flex flex-col h-48 animate-pulse">
          <div class="flex justify-between items-start mb-4">
            <div class="w-12 h-12 rounded-xl bg-white/5"></div>
            <div class="w-6 h-6 rounded bg-white/5"></div>
          </div>
          <div class="w-3/4 h-5 rounded bg-white/5 mb-2"></div>
          <div class="w-1/2 h-3 rounded bg-white/5 mb-4"></div>
          <div class="w-full h-8 rounded bg-white/5 mt-auto"></div>
        </div>
        <div class="glass-panel rounded-2xl p-5 flex flex-col h-48 animate-pulse hidden sm:flex">
          <div class="flex justify-between items-start mb-4">
            <div class="w-12 h-12 rounded-xl bg-white/5"></div>
            <div class="w-6 h-6 rounded bg-white/5"></div>
          </div>
          <div class="w-3/4 h-5 rounded bg-white/5 mb-2"></div>
          <div class="w-1/2 h-3 rounded bg-white/5 mb-4"></div>
          <div class="w-full h-8 rounded bg-white/5 mt-auto"></div>
        </div>
        <div class="glass-panel rounded-2xl p-5 flex flex-col h-48 animate-pulse hidden lg:flex">
          <div class="flex justify-between items-start mb-4">
            <div class="w-12 h-12 rounded-xl bg-white/5"></div>
            <div class="w-6 h-6 rounded bg-white/5"></div>
          </div>
          <div class="w-3/4 h-5 rounded bg-white/5 mb-2"></div>
          <div class="w-1/2 h-3 rounded bg-white/5 mb-4"></div>
          <div class="w-full h-8 rounded bg-white/5 mt-auto"></div>
        </div>
      </div>

    </div>
  </div>

<script>
  // --- SIDEBAR LOGIC ---
  let isSidebarCollapsed = false;
  function toggleSidebar() {
    isSidebarCollapsed = !isSidebarCollapsed;
    const sidebar = document.getElementById('sidebar');
    const texts = document.querySelectorAll('.sidebar-text');
    const tooltips = document.querySelectorAll('.tooltip');
    const icon = document.getElementById('sidebarToggleIcon');

    if(isSidebarCollapsed) {
      sidebar.classList.remove('md:w-64');
      sidebar.classList.add('md:w-20');
      texts.forEach(el => el.classList.add('opacity-0', 'hidden'));
      tooltips.forEach(el => el.classList.remove('hidden'));
      icon.classList.add('rotate-180');
    } else {
      sidebar.classList.remove('md:w-20');
      sidebar.classList.add('md:w-64');
      texts.forEach(el => { el.classList.remove('hidden'); setTimeout(()=> el.classList.remove('opacity-0'), 100); });
      tooltips.forEach(el => el.classList.add('hidden'));
      icon.classList.remove('rotate-180');
    }
  }

  function toggleMobileSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
  }

  // --- TOAST NOTIFICATIONS ---
  function triggerToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    
    let icon = 'ph-info';
    let bgColor = 'bg-blue-500/10 border-blue-500/20';
    let iconColor = 'text-blue-400';
    
    if(type === 'success') { icon = 'ph-check-circle'; bgColor = 'bg-green-500/10 border-green-500/20'; iconColor = 'text-green-400'; }
    if(type === 'error') { icon = 'ph-warning-circle'; bgColor = 'bg-red-500/10 border-red-500/20'; iconColor = 'text-red-400'; }
    if(type === 'warning') { icon = 'ph-warning'; bgColor = 'bg-yellow-500/10 border-yellow-500/20'; iconColor = 'text-yellow-400'; }

    toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-xl border backdrop-blur-md shadow-lg pointer-events-auto ${bgColor}`;
    toast.innerHTML = `<i class="ph-fill ${icon} ${iconColor} text-xl"></i><span class="text-sm font-medium text-white">${message}</span>`;
    
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      toast.style.transition = 'all 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  // --- API DATA FETCHING ---
  let activeApps = [];

  async function fetchApps() {
    try {
      const res = await fetch('http://127.0.0.1:8000/api/apps');
      if(!res.ok) throw new Error('App Metadata Fetch Failed');
      const data = await res.json();
      if(data.applications) {
        activeApps = data.applications.map((app, index) => ({
          id: `app${index}`,
          name: app.name,
          version: 'Unknown',
          size: 'Unknown',
          publisher: app.publisher,
          icon: app.icon,
          color: 'text-cyan-400',
          update: false
        }));
        renderApps();
      }
    } catch(err) {
      console.error('App Grid Fetch Error:', err);
      // Fallback or error state UI could go here
    }
  }

  // --- RENDER APP GRID ---
  function renderApps() {
    const grid = document.getElementById('appGrid');
    if(!grid) return;
    grid.innerHTML = '';
    
    if(activeApps.length === 0) {
      grid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-500">No applications found</div>';
      return;
    }

    activeApps.forEach(app => {
      const updateBadge = app.update 
        ? `<div class="absolute -top-1 -right-1 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500 border border-panelBg"></span></div>` 
        : '';

      const updateBtn = app.update
        ? `<button onclick="triggerToast('Updating ${app.name}...', 'success')" class="text-cyan-400 text-xs font-medium hover:text-cyan-300 transition-colors">Update Available</button>`
        : `<span class="text-gray-500 text-xs">Up to date</span>`;

      const cardHTML = `
        <div class="glass-panel rounded-2xl p-5 flex flex-col h-full relative group transition-all hover:border-white/10 hover:shadow-lg hover:shadow-black/50" id="card-${app.id}">
          
          <div class="flex justify-between items-start mb-4">
            <div class="relative w-12 h-12 rounded-xl bg-black/40 border border-white/5 flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform">
              <i class="ph-fill ${app.icon} ${app.color} text-2xl"></i>
              ${updateBadge}
            </div>
            <button class="text-gray-500 hover:text-white p-1 transition-colors"><i class="ph-bold ph-dots-three"></i></button>
          </div>

          <div class="mb-4 flex-1">
            <h3 class="text-lg font-semibold text-white truncate" title="${app.name}">${app.name}</h3>
            <p class="text-xs text-gray-400 mt-0.5">${app.publisher}</p>
            <div class="flex justify-between items-center mt-3 bg-black/20 p-2 rounded-lg border border-white/5">
              <div class="text-xs text-gray-400"><i class="ph ph-tag"></i> ${app.version}</div>
              <div class="text-xs text-gray-400"><i class="ph ph-hard-drives"></i> ${app.size}</div>
            </div>
          </div>

          <div class="flex flex-col gap-2 mt-auto">
            <div class="flex justify-between items-center mb-1">
              ${updateBtn}
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="launchApp('${app.name}')" class="bg-white/5 hover:bg-white/10 text-white border border-white/10 py-1.5 rounded-lg text-sm font-medium transition-colors">
                Open
              </button>
              <button onclick="requestUninstall('${app.id}', '${app.name}')" class="bg-red-500/10 hover:bg-red-500 hover:text-white text-red-400 border border-red-500/20 py-1.5 rounded-lg text-sm font-medium transition-all">
                Uninstall
              </button>
            </div>
          </div>

        </div>
      `;
      grid.innerHTML += cardHTML;
    });
  }

  // Init grid
  fetchApps();

  // --- ACTIONS ---
  function launchApp(appName) {
    triggerToast(`Launching ${appName}...`, 'success');
  }

  // --- UNINSTALL MODAL LOGIC ---
  const modal = document.getElementById('confirmModal');
  const modalContent = document.getElementById('modalContent');
  let appToUninstall = null;

  function requestUninstall(appId, appName) {
    appToUninstall = { id: appId, name: appName };
    document.getElementById('modalDesc').innerText = `Are you sure you want to completely remove ${appName} and all its associated data from your system?`;
    
    modal.classList.remove('hidden');
    setTimeout(() => {
      modal.classList.remove('opacity-0');
      modalContent.classList.remove('scale-95');
    }, 10);
  }

  function closeModal() {
    modal.classList.add('opacity-0');
    modalContent.classList.add('scale-95');
    setTimeout(() => modal.classList.add('hidden'), 300);
    appToUninstall = null;
  }

  document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
    if(appToUninstall) {
      const btn = document.getElementById('modalConfirmBtn');
      btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Uninstalling...';
      btn.disabled = true;

      // Mock delay to simulate backend script
      await new Promise(r => setTimeout(r, 1000));

      const card = document.getElementById(`card-${appToUninstall.id}`);
      if(card) {
        card.classList.add('card-removing');
        setTimeout(() => {
          const idx = activeApps.findIndex(a => a.id === appToUninstall.id);
          if(idx > -1) activeApps.splice(idx, 1);
          renderApps();
        }, 300);
      }

      triggerToast(`${appToUninstall.name} uninstalled successfully`, 'success');
      
      btn.innerHTML = 'Uninstall';
      btn.disabled = false;
      closeModal();
    }
  });

</script>
</body>
</html>
